last_updated: 2026-09-19
source: https://platform.claude.com/docs/en/about-claude/pricing
notes: |
  Rates are USD per 1M tokens.
  cache_creation = 5-minute TTL cache write (1.25x base input); 1-hour TTL (2x)
  is not tracked separately.
  cache_read = 0.1x base input for all models EXCEPT claude-fable-5-1, which is
  0.025x (not derived from the multiplier rule — Anthropic prices Fable 5.1 cache
  hits at 0.025x base input).
  The claude-sonnet-5 introductory rate became the standard rate; the planned
  increase to $3/$15 scheduled for Sept 1, 2026 was cancelled by Anthropic.
  Hence $2/$10 is the current standard price.
  Verify against the source URL on every bump and update last_updated.
